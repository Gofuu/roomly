name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # A real Postgres: the tests are about the overlap constraint, row-level
      # security and simultaneous requests, which a fake database cannot show.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Builds the Docker image for the server (an ARM machine). Every push checks
  # that it builds; pushes to main also publish it for deploy/deploy.sh to roll out.
  image:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          build-args: VITE_SHOW_DEMO_ACCOUNTS=true
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/gofuu/roomly-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
